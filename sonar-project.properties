# ==============================================================================
# SonarCloud Project Configuration for GoDevOps
# ==============================================================================

# Unique project key and organization from SonarCloud
sonar.projectKey=ZohaibHasan2280168_GoDevOps
sonar.organization=zohaibhasan2280168

# Project metadata
sonar.projectName=GoDevOps
sonar.projectVersion=1.0.0

# Source directories to analyze
sonar.sources=backend,frontend/src

# Test directories
sonar.tests=backend/tests

# Files and directories to exclude from analysis (dependencies, build outputs, coverage)
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.js,**/uploads/**,**/.dockerignore

# Code coverage report path generated by Jest
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Source code encoding
sonar.sourceEncoding=UTF-8
