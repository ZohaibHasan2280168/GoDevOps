global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # 1. Scrape GoDevOps Backend API Metrics
  - job_name: 'godevops-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:5000', 'host.docker.internal:5000']
        labels:
          app: 'godevops'
          service: 'backend-api'
          environment: 'production'

  # 2. Host Node Hardware & OS Metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']
        labels:
          instance: 'host-machine'

  # 3. Prometheus Self-Monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
