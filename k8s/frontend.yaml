apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: godevops
  labels:
    app: frontend
    tier: web
spec:
  replicas: 1  # 1 replica fits perfectly on t3.micro node
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: web
    spec:
      containers:
        - name: frontend
          image: 479537131188.dkr.ecr.us-east-1.amazonaws.com/godevops-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: "250m"
              memory: "128Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
          startupProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 10 # 30 seconds startup window
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: godevops
  labels:
    app: frontend
spec:
  type: LoadBalancer # AWS Elastic Load Balancer (ALB/CLB) for Internet ingress
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: frontend
