apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: godevops-application
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # Source of Truth: Monitored Git Repository
  source:
    repoURL: 'https://github.com/ZohaibHasan2280168/GoDevOps.git'
    targetRevision: main
    path: k8s

  # Destination: Target Kubernetes Cluster & Namespace
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: godevops

  # GitOps Automation Policy
  syncPolicy:
    automated:
      prune: true     # Automatically deletes K8s resources removed from Git
      selfHeal: true  # Automatically reverts manual 'kubectl' edits back to Git state!
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
