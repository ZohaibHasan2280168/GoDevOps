name: GoDevOps CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  # ============================================================================
  # 1. Automated Testing & SonarCloud Quality Gate
  # ============================================================================
  test-and-quality:
    name: Unit Tests & SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Disabling shallow clone is recommended for SonarCloud Git analysis
          fetch-depth: 0

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Execute Automated Test Suites & Coverage
        run: |
          cd backend
          npm test

      - name: SonarCloud Code Analysis & Quality Gate
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true # Allows pipeline to proceed even before user adds SonarCloud secret token

  # ============================================================================
  # 2. DevSecOps Security & Vulnerability Audit (Trivy)
  # ============================================================================
  security-audit:
    name: Trivy Security & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Non-blocking alert for audit report

  # ============================================================================
  # 3. Docker Image Build Verification
  # ============================================================================
  docker-build-verify:
    name: Docker Multi-Stage Build Verification
    needs: [test-and-quality, security-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: godevops-backend:ci-test

      - name: Build Frontend Multi-Stage Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: godevops-frontend:ci-test
